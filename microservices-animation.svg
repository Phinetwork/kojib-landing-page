<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 400" width="800" height="400" style="background: linear-gradient(145deg, #1e1e30, #00cc80);">
  <!-- Background Glow -->
  <defs>
    <radialGradient id="glow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff99" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e1e30" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="url(#glow-gradient)" />

  <!-- Central Node -->
  <circle cx="400" cy="200" r="40" fill="#00cc80" stroke="#ffffff" stroke-width="2">
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="6.18s" repeatCount="indefinite" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" calcMode="spline" />
  </circle>

  <!-- Microservices Nodes -->
  <g id="microservices">
    <circle cx="300" cy="100" r="20" fill="#00ff99">
      <animate attributeName="r" values="20;25;20" dur="6.18s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="100" r="20" fill="#00ff99">
      <animate attributeName="r" values="20;25;20" dur="6.18s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="300" r="20" fill="#00ff99">
      <animate attributeName="r" values="20;25;20" dur="6.18s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="300" r="20" fill="#00ff99">
      <animate attributeName="r" values="20;25;20" dur="6.18s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Connecting Lines -->
  <g id="lines" stroke="#00ff99" stroke-width="2">
    <line x1="400" y1="200" x2="300" y2="100">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="6.18s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="200" x2="500" y2="100">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="6.18s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="200" x2="300" y2="300">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="6.18s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="200" x2="500" y2="300">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="6.18s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Circular Orbiting Nodes -->
  <circle cx="400" cy="200" r="80" fill="none" stroke="#ffffff" stroke-dasharray="5 5">
    <animateTransform attributeName="transform" type="rotate" from="0 400 200" to="360 400 200" dur="6.18s" repeatCount="indefinite" />
  </circle>

  <circle cx="480" cy="200" r="15" fill="#ffffff">
    <animateTransform attributeName="transform" type="rotate" from="0 400 200" to="360 400 200" dur="6.18s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsing Halo Effect -->
  <circle cx="400" cy="200" r="50" fill="none" stroke="#00cc80" stroke-width="2" stroke-opacity="0.5">
    <animate attributeName="r" values="50;70;50" dur="6.18s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="6.18s" repeatCount="indefinite" />
  </circle>

</svg>
