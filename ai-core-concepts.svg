<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <!-- Background -->
  <defs>
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A1A2E" />
      <stop offset="100%" stop-color="#0F0F1C" />
    </radialGradient>

    <!-- Glow Effect -->
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Neural Path Gradient -->
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#backgroundGradient)" />

  <!-- Central Node -->
  <circle cx="600" cy="300" r="120" fill="url(#glowEffect)" />
  <circle cx="600" cy="300" r="100" fill="#00FFFF" stroke="#0077FF" stroke-width="4" />

  <!-- Neural Paths -->
  <path d="M600 300 C 450 150, 350 250, 250 150" stroke="url(#pathGradient)" stroke-width="4" fill="none" />
  <circle cx="250" cy="150" r="20" fill="#00FFFF" />
  <text x="230" y="145" font-family="'Arial', sans-serif" font-size="16" fill="#FFFFFF">ML</text>

  <path d="M600 300 C 750 150, 850 250, 950 150" stroke="url(#pathGradient)" stroke-width="4" fill="none" />
  <circle cx="950" cy="150" r="20" fill="#0077FF" />
  <text x="930" y="145" font-family="'Arial', sans-serif" font-size="16" fill="#FFFFFF">DL</text>

  <path d="M600 300 C 600 50, 850 100, 850 300" stroke="url(#pathGradient)" stroke-width="4" fill="none" />
  <circle cx="850" cy="300" r="20" fill="#00FFFF" />
  <text x="830" y="295" font-family="'Arial', sans-serif" font-size="16" fill="#FFFFFF">NLP</text>

  <path d="M600 300 C 400 400, 500 550, 400 550" stroke="url(#pathGradient)" stroke-width="4" fill="none" />
  <circle cx="400" cy="550" r="20" fill="#0077FF" />
  <text x="380" y="545" font-family="'Arial', sans-serif" font-size="16" fill="#FFFFFF">CV</text>

  <!-- Outer Glow Pulses -->
  <circle cx="600" cy="300" r="130" fill="none" stroke="#00FFFF" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="130;150;130" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="300" r="160" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="160;180;160" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.1;0.2" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Rotating Connections -->
  <g>
    <circle cx="600" cy="300" r="180" fill="none" stroke="#0077FF" stroke-width="2" opacity="0.4" />
    <circle cx="600" cy="300" r="220" fill="none" stroke="#0077FF" stroke-width="1" opacity="0.3" />
    <animateTransform attributeName="transform" type="rotate" from="0 600 300" to="360 600 300" dur="12s" repeatCount="indefinite" />
  </g>
</svg>