<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Leaf Shape -->
  <path d="M100,50 Q140,100 100,150 Q60,100 100,50 Z" fill="none" stroke="#00FF99" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Energy Circles -->
  <circle cx="100" cy="100" r="6" fill="#00FF99">
    <animate attributeName="r" values="6; 12; 6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
