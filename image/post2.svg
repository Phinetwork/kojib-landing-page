<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#00ff99" />
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00ff99" />
    </linearGradient>
  </defs>

  <!-- Background Rectangle -->
  <rect x="0" y="0" width="400" height="300" fill="url(#bgGradient)" />

  <!-- Glow Circle -->
  <circle cx="200" cy="150" r="120" fill="url(#glowGradient)" opacity="0.6">
    <animate attributeName="r" values="120;140;120" dur="2.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="2.618s" repeatCount="indefinite" />
  </circle>

  <!-- Microservices Icon -->
  <g transform="translate(100, 50)">
    <!-- Nodes -->
    <circle cx="50" cy="50" r="20" fill="#ffffff">
      <animate attributeName="r" values="20;22;20" dur="1.618s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#ffffff;#00ff99;#ffffff" dur="1.618s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="50" r="20" fill="#ffffff">
      <animate attributeName="r" values="20;22;20" dur="1.618s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#ffffff;#0077ff;#ffffff" dur="1.618s" repeatCount="indefinite" />
    </circle>
    <circle cx="100" cy="150" r="20" fill="#ffffff">
      <animate attributeName="r" values="20;22;20" dur="1.618s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#ffffff;#00ff99;#ffffff" dur="1.618s" repeatCount="indefinite" />
    </circle>

    <!-- Connections -->
    <line x1="50" y1="50" x2="150" y2="50" stroke="#ffffff" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.618s" repeatCount="indefinite" />
    </line>
    <line x1="50" y1="50" x2="100" y2="150" stroke="#ffffff" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.618s" repeatCount="indefinite" />
    </line>
    <line x1="150" y1="50" x2="100" y2="150" stroke="#ffffff" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.618s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Dynamic Title Text -->
  <text x="50%" y="90%" font-size="24" font-family="Arial, sans-serif" fill="url(#textGradient)" text-anchor="middle" dominant-baseline="middle">
    Scalable Web Applications
    <animate attributeName="opacity" values="1;0.8;1" dur="2.618s" repeatCount="indefinite" />
  </text>
</svg>
