<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#00ff99" stroke-width="4" />

  <!-- Inner Glow -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(0, 255, 153, 0.3)" stroke-width="6">
    <animate attributeName="stroke-width" values="6;8;6" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Predictive Modeling Wave -->
  <path d="M20 150 C50 80, 150 80, 180 150" stroke="#ffffff" fill="none" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke" values="#ffffff;#00ff99;#ffffff" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Dots -->
  <circle cx="50" cy="100" r="5" fill="#ffffff">
    <animate attributeName="cy" values="100;95;100" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ffffff;#00ff99;#ffffff" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="100" r="5" fill="#ffffff">
    <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ffffff;#00ff99;#ffffff" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="100" r="5" fill="#ffffff">
    <animate attributeName="cy" values="100;105;100" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#ffffff;#00ff99;#ffffff" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Rotating Inner Shape -->
  <g>
    <polygon points="100,70 110,100 100,130 90,100" fill="#00ff99" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Pulsating Background Circle -->
  <circle cx="100" cy="100" r="80" fill="rgba(0, 255, 153, 0.2)">
    <animate attributeName="r" values="80;85;80" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
