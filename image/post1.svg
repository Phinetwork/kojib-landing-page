<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid meet">
  <!-- Background Gradient -->
  <defs>
    <radialGradient id="postBgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff99" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0099ff" stop-opacity="0.1" />
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
    </filter>
  </defs>

  <!-- Background Glow -->
  <rect x="0" y="0" width="400" height="300" fill="url(#postBgGradient)" />

  <!-- Image Placeholder -->
  <rect x="20" y="20" width="360" height="160" rx="10" fill="#1e1e2f">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.618s" repeatCount="indefinite" />
  </rect>

  <!-- Title Box -->
  <rect x="20" y="200" width="360" height="40" rx="8" fill="#00ff99" opacity="0.8" />
  <text x="30" y="225" font-size="16" font-family="Arial, sans-serif" fill="#1e1e2f" font-weight="bold">
    Top 10 Open-Source Libraries for Data Science
  </text>

  <!-- Description Box -->
  <rect x="20" y="250" width="360" height="30" rx="8" fill="#0099ff" opacity="0.8" />
  <text x="30" y="270" font-size="14" font-family="Arial, sans-serif" fill="#ffffff">
    Enhance your data science projects with these powerful libraries.
  </text>

  <!-- Animated Particle Effect -->
  <circle cx="200" cy="150" r="5" fill="#00ff99" opacity="0.7" filter="url(#softBlur)">
    <animateTransform attributeName="transform" type="translate" values="-150 -100; 150 100; -150 -100" dur="6.854s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="6.854s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="150" r="3" fill="#0099ff" opacity="0.6" filter="url(#softBlur)">
    <animateTransform attributeName="transform" type="translate" values="100 50; -100 -50; 100 50" dur="6.854s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="6.854s" repeatCount="indefinite" />
  </circle>
</svg>
