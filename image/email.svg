<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100" height="100" id="email-icon-svg">
  <defs>
    <!-- Glow Effects -->
    <filter id="emailGlow">
      <feGaussianBlur stdDeviation="6" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradient for Envelope Base -->
    <radialGradient id="envelopeGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 1)" />
      <stop offset="100%" stop-color="rgba(0, 153, 255, 0.5)" />
    </radialGradient>
  </defs>

  <!-- Envelope Base -->
  <rect x="75" y="175" width="350" height="150" rx="20" fill="url(#envelopeGradient)" filter="url(#emailGlow)">
    <animateTransform 
      attributeName="transform" 
      type="scale" 
      values="1;1.03;1" 
      dur="3s" 
      repeatCount="indefinite" />
  </rect>

  <!-- Envelope Flap -->
  <polygon points="75,175 250,120 425,175" fill="rgba(255, 255, 255, 0.9)" filter="url(#emailGlow)">
    <animate attributeName="points" 
      values="75,175 250,140 425,175; 75,175 250,120 425,175; 75,175 250,140 425,175" 
      dur="4s" 
      repeatCount="indefinite" />
  </polygon>

  <!-- Letter Inside -->
  <rect x="90" y="185" width="320" height="130" rx="10" fill="rgba(255, 255, 255, 1)">
    <animate attributeName="y" values="185;180;185" dur="2.5s" repeatCount="indefinite" />
  </rect>

  <!-- Glow Pulse Lines -->
  <line x1="250" y1="250" x2="75" y2="175" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
  </line>
  <line x1="250" y1="250" x2="425" y2="175" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite" />
  </line>

  <!-- Floating Particles -->
  <circle cx="100" cy="140" r="4" fill="rgba(0, 255, 153, 0.8)">
    <animate attributeName="cy" values="140;130;140" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="140" r="3" fill="rgba(255, 255, 255, 0.8)">
    <animate attributeName="cy" values="140;150;140" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="250" cy="330" r="5" fill="rgba(0, 153, 255, 0.9)">
    <animate attributeName="cy" values="330;340;330" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="5;7;5" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsating Aura -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="rgba(0, 153, 255, 0.2)" stroke-width="2">
    <animate attributeName="r" values="200;220;200" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>