<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradientPerf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="100%" stop-color="#9013FE" />
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="glowGradientPerf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGradientPerf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#9013FE" />
    </linearGradient>
  </defs>

  <!-- Background Rectangle -->
  <rect x="0" y="0" width="400" height="300" fill="url(#bgGradientPerf)" />

  <!-- Glow Circle -->
  <circle cx="200" cy="150" r="140" fill="url(#glowGradientPerf)" opacity="0.6">
    <animate attributeName="r" values="140;160;140" dur="2.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="2.618s" repeatCount="indefinite" />
  </circle>

  <!-- Featured Gear Icon -->
  <g transform="translate(150, 80)">
    <path d="M50 0 L58 35 H85 L65 55 L75 90 L50 70 L25 90 L35 55 L15 35 H42 Z" fill="#ffffff">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="3.236s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#ffffff;#4A90E2;#9013FE;#ffffff" dur="3.236s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Title Text -->
  <text x="50%" y="50%" font-size="24" font-family="Arial, sans-serif" fill="url(#textGradientPerf)" text-anchor="middle" dominant-baseline="middle">
    Optimize Your Code
    <animate attributeName="opacity" values="1;0.8;1" dur="2.618s" repeatCount="indefinite" />
  </text>

  <!-- Subtle Particle Effect -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" opacity="0.6">
    <animate attributeName="cx" values="50;200;350" dur="2.618s" repeatCount="indefinite" />
    <animate attributeName="cy" values="50;150;250" dur="2.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.618s" repeatCount="indefinite" />
  </circle>
  <circle cx="350" cy="250" r="3" fill="#ffffff" opacity="0.6">
    <animate attributeName="cx" values="350;200;50" dur="2.618s" repeatCount="indefinite" />
    <animate attributeName="cy" values="250;150;50" dur="2.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.618s" repeatCount="indefinite" />
  </circle>
</svg>
