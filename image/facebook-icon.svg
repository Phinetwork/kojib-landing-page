<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100" height="100" id="facebook-icon-svg">
  <defs>
    <!-- Gradient for Facebook Icon -->
    <linearGradient id="facebookGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#4267B2" />
      <stop offset="100%" stop-color="#3B5998" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="facebookGlow">
      <feGaussianBlur stdDeviation="4" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#facebookGradient)" filter="url(#facebookGlow)">
    <animate attributeName="r" values="30;32;30" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Facebook "f" Logo -->
  <path
    d="M35 19h6V9h-6c-6 0-9 4-9 9v4h-5v8h5v20h8V31h6l1-8h-7v-4c0-1 1-2 2-2z"
    fill="white"
    transform="translate(4, 4) scale(0.8)"
  />

  <!-- Glow Pulse Animation -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="white" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="30;35;30" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
