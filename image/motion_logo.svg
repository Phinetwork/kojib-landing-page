<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradient -->
    <radialGradient id="gradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="rgba(0, 153, 255, 0.8)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.2)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="250" cy="250" r="240" fill="url(#gradient)" filter="url(#glow)" />

  <!-- Infinity Shape -->
  <path d="M150,250 C150,150 250,150 250,250 C250,350 350,350 350,250 C350,150 250,150 250,250" 
        fill="none" stroke="white" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" from="0 250 250" to="360 250 250" dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Dynamic Connections -->
  <g id="connections">
    <!-- Example Node -->
    <circle cx="150" cy="200" r="5" fill="rgba(0, 255, 153, 0.8)" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="200;210;200" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="300" r="5" fill="rgba(0, 153, 255, 0.8)" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;290;300" dur="3s" repeatCount="indefinite" />
    </circle>
    <line x1="150" y1="200" x2="350" y2="300" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Expanding Rings -->
  <circle cx="250" cy="250" r="50" fill="none" stroke="rgba(0, 255, 153, 0.6)" stroke-width="2">
    <animate attributeName="r" values="50;150;50" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="250" cy="250" r="100" fill="none" stroke="rgba(0, 153, 255, 0.4)" stroke-width="2">
    <animate attributeName="r" values="100;200;100" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="8s" repeatCount="indefinite" />
  </circle>
</svg>
