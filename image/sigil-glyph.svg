<?xml version="1.0" encoding="utf-8"?>
<!--  Sigil-Glyph · v1.0  “Living Seal”  -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  aria-labelledby="title desc"
  role="img">

  <title id="title">Sigil-Glyph — Eternal Light-Code Seal</title>
  <desc id="desc">
    A glowing circular seal with a pulsing core, rotating outer ring,
    and cross-hair that marks verifiable moments inside the Kai-Klock system.
  </desc>

  <!-- ═════ Gradients & Filter ═════ -->
  <defs>
    <!-- Soft aura -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#00ff99" stop-opacity=".85"/>
      <stop offset="65%" stop-color="#00ccff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>

    <!-- Stroke gradient (green → cyan) -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00ff99"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>

    <!-- Gentle bloom -->
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═════ Breathing Aura ═════ -->
  <circle cx="32" cy="32" r="28" fill="url(#aura)" filter="url(#bloom)">
    <animate attributeName="r" values="26;30;26"
             dur="5.236s" repeatCount="indefinite"
             calcMode="spline"
             keySplines=".55 .08 .68 1;.55 .08 .68 1" />
    <animate attributeName="opacity" values=".55;.85;.55"
             dur="5.236s" repeatCount="indefinite"
             calcMode="spline"
             keySplines=".55 .08 .68 1;.55 .08 .68 1" />
  </circle>

  <!-- ═════ Rotating Verification Ring ═════ -->
  <g id="ring" transform="rotate(0 32 32)">
    <circle cx="32" cy="32" r="22"
            fill="none"
            stroke="url(#strokeGrad)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-dasharray="4 4"/>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 32 32" to="360 32 32"
                      dur="36s" repeatCount="indefinite"/>
  </g>

  <!-- ═════ Static Cross-Hair ═════ -->
  <path d="M20 32h24M32 20v24"
        stroke="url(#strokeGrad)"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- ═════ Pulsing Inner Core ═════ -->
  <circle cx="32" cy="32" r="6"
          fill="url(#strokeGrad)" filter="url(#bloom)">
    <animate attributeName="r" values="4;8;4"
             dur="5.236s" repeatCount="indefinite"
             calcMode="spline"
             keySplines=".55 .08 .68 1;.55 .08 .68 1"/>
    <animate attributeName="opacity" values=".8;1;.8"
             dur="5.236s" repeatCount="indefinite"
             calcMode="spline"
             keySplines=".55 .08 .68 1;.55 .08 .68 1"/>
  </circle>
</svg>
