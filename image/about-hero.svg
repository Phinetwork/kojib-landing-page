<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" fill="none">
  <style>
    .wave {
      animation: waveMotion 8s infinite linear;
    }

    .flow {
      animation: flowPulse 6s infinite ease-in-out;
    }

    @keyframes waveMotion {
      0% {
        d: path('M0,250 C250,150 500,350 750,250 S1250,150 1500,250 V500 H0 Z');
      }
      50% {
        d: path('M0,250 C250,350 500,150 750,250 S1250,350 1500,250 V500 H0 Z');
      }
      100% {
        d: path('M0,250 C250,150 500,350 750,250 S1250,150 1500,250 V500 H0 Z');
      }
    }

    @keyframes flowPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }
  </style>

  <!-- Infinite wave pattern -->
  <path class="wave" d="M0,250 C250,150 500,350 750,250 S1250,150 1500,250 V500 H0 Z" fill="#00FF99">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" 
      values="M0,250 C250,150 500,350 750,250 S1250,150 1500,250 V500 H0 Z;
              M0,250 C250,350 500,150 750,250 S1250,350 1500,250 V500 H0 Z;
              M0,250 C250,150 500,350 750,250 S1250,150 1500,250 V500 H0 Z" />
  </path>

  <!-- Organic glowing elements -->
  <circle class="flow" cx="200" cy="250" r="50" fill="#00FF99" opacity="0.6">
    <animate attributeName="cx" values="200;800;200" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle class="flow" cx="800" cy="250" r="50" fill="#00FF99" opacity="0.6">
    <animate attributeName="cx" values="800;200;800" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsing center glow -->
  <circle class="flow" cx="500" cy="250" r="80" fill="#00FF99" opacity="0.4">
    <animate attributeName="r" values="80;100;80" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
