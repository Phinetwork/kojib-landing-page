<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" aria-labelledby="aboutHeroTitle" role="img">
  <title id="aboutHeroTitle">Kojib About Page Hero Graphic</title>

  <!-- Background Gradients -->
  <defs>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00cc80">
        <animate attributeName="stop-color" values="#00cc80;#00995e;#007744;#00cc80" dur="13.162s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00995e">
        <animate attributeName="stop-color" values="#00995e;#007744;#00cc80;#00995e" dur="17.857s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="heroRadial" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.8)">
        <animate attributeName="stop-color" values="rgba(255, 255, 255, 0.8);rgba(255, 255, 255, 0.6);rgba(255, 255, 255, 0.8)" dur="21.345s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <!-- Background Rectangle -->
  <rect x="0" y="0" width="1440" height="600" fill="url(#heroGradient)" />

  <!-- Pulsating Circle -->
  <circle cx="720" cy="300" r="280" fill="url(#heroRadial)" opacity="0.6">
    <animate attributeName="r" values="280;310;260;280" dur="18.532s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.8;0.5;0.6" dur="22.857s" repeatCount="indefinite" />
  </circle>

  <!-- Abstract Flowing Paths -->
  <path d="M200 100 Q400 300 600 100 T1000 100" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,500;500,0;0,500" dur="14.618s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0 0;0 15;0 -15;0 0" dur="19.457s" repeatCount="indefinite" />
  </path>
  <path d="M150 500 Q300 300 450 500 T1050 500" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,500;500,0;0,500" dur="21.932s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -15;0 15;0 0" dur="17.182s" repeatCount="indefinite" />
  </path>

  <!-- Glowing Dots and Circuit Paths -->
  <g fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8">
    <path d="M900 150 v100 h100">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 5;0 0" dur="19.347s" repeatCount="indefinite" />
    </path>
    <circle cx="1000" cy="250" r="6" fill="#ffffff">
      <animate attributeName="r" values="6;9;6" dur="15.213s" repeatCount="indefinite" />
    </circle>
    <path d="M400 450 h-100 v-100">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 5;0 0" dur="13.514s" repeatCount="indefinite" />
    </path>
    <circle cx="300" cy="350" r="6" fill="#ffffff">
      <animate attributeName="r" values="6;9;6" dur="19.618s" repeatCount="indefinite" />
    </circle>
    <path d="M1200 400 v-150 h-100">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 5;0 0" dur="23.218s" repeatCount="indefinite" />
    </path>
    <circle cx="1100" cy="250" r="6" fill="#ffffff">
      <animate attributeName="r" values="6;9;6" dur="18.475s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Central Title -->
  <text x="50%" y="35%" text-anchor="middle" font-family="'Arial', sans-serif" font-size="60" fill="#ffffff" font-weight="bold">
    Redefining Technology
    <animateTransform attributeName="transform" type="scale" values="1 1;1.05 1.05;1 1" dur="22.618s" repeatCount="indefinite" />
  </text>
  <text x="50%" y="45%" text-anchor="middle" font-family="'Arial', sans-serif" font-size="24" fill="#ffffff" font-weight="300">
    Empowering people. Inspiring progress.
    <animate attributeName="opacity" values="1;0.8;1" dur="21.618s" repeatCount="indefinite" />
  </text>

  <!-- Bottom Wave Design -->
  <path d="M0 500 Q360 600 720 500 T1440 500 L1440 600 L0 600 Z" fill="#ffffff" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -15;0 15;0 0" dur="20.618s" repeatCount="indefinite" />
  </path>
</svg>
