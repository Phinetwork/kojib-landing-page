<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" id="kojib-differentiators-svg">
  <defs>
    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradient Definitions -->
    <radialGradient id="centralGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="rgba(0, 255, 153, 1)" />
      <stop offset="100%" stop-color="rgba(0, 153, 255, 0.1)" />
    </radialGradient>
  </defs>

  <!-- Background Glow -->
  <circle cx="250" cy="250" r="240" fill="url(#centralGradient)" opacity="0.5">
    <animate attributeName="r" values="240;260;240" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Central Core -->
  <circle cx="250" cy="250" r="50" fill="rgba(255, 255, 255, 0.9)" filter="url(#glow)">
    <animateTransform
      attributeName="transform"
      type="scale"
      values="1;1.1;1"
      dur="4s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Differentiators Branches -->
  <g id="branches">
    <!-- Top Branch -->
    <path d="M250,250 Q250,100 350,150" stroke="rgba(0, 255, 153, 0.8)" stroke-width="2" fill="none" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </path>
    <circle cx="350" cy="150" r="10" fill="rgba(0, 255, 153, 0.8)" filter="url(#glow)">
      <animate attributeName="r" values="10;12;10" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Right Branch -->
    <path d="M250,250 Q400,250 350,350" stroke="rgba(0, 153, 255, 0.8)" stroke-width="2" fill="none" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" />
    </path>
    <circle cx="350" cy="350" r="10" fill="rgba(0, 153, 255, 0.8)" filter="url(#glow)">
      <animate attributeName="r" values="10;12;10" dur="3.5s" repeatCount="indefinite" />
    </circle>

    <!-- Bottom Branch -->
    <path d="M250,250 Q250,400 150,350" stroke="rgba(255, 255, 255, 0.8)" stroke-width="2" fill="none" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
    </path>
    <circle cx="150" cy="350" r="10" fill="rgba(255, 255, 255, 0.8)" filter="url(#glow)">
      <animate attributeName="r" values="10;12;10" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Left Branch -->
    <path d="M250,250 Q100,250 150,150" stroke="rgba(255, 255, 255, 0.8)" stroke-width="2" fill="none" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite" />
    </path>
    <circle cx="150" cy="150" r="10" fill="rgba(255, 255, 255, 0.8)" filter="url(#glow)">
      <animate attributeName="r" values="10;12;10" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Energy Pulses -->
  <g id="energy-pulses">
    <circle cx="250" cy="250" r="3" fill="rgba(255, 255, 255, 0.7)">
      <animate attributeName="cx" values="250;350;250" dur="2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="250;150;250" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="250" r="3" fill="rgba(0, 255, 153, 0.8)">
      <animate attributeName="cx" values="250;350;250" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="250;350;250" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="250" r="3" fill="rgba(0, 153, 255, 0.8)">
      <animate attributeName="cx" values="250;150;250" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cy" values="250;350;250" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
