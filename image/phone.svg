<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" id="phone-icon-svg">
  <defs>
    <!-- Glow Effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Glossy Reflection -->
    <linearGradient id="reflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>
  </defs>

  <!-- Phone Base -->
  <g filter="url(#glow)">
    <rect x="30" y="20" width="40" height="60" rx="7" fill="rgba(0, 153, 255, 0.8)" />
    <rect x="35" y="25" width="30" height="50" rx="3" fill="rgba(255, 255, 255, 0.9)" />
    <rect x="35" y="25" width="30" height="50" rx="3" fill="url(#reflection)" />
    <circle cx="50" cy="70" r="4" fill="rgba(0, 153, 255, 0.9)" />
  </g>

  <!-- Dynamic Pulses -->
  <circle cx="50" cy="50" r="10" fill="none" stroke="rgba(0, 255, 153, 0.6)" stroke-width="2">
    <animate attributeName="r" values="10;25;10" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="50" r="25" fill="none" stroke="rgba(0, 153, 255, 0.4)" stroke-width="2">
    <animate attributeName="r" values="25;40;25" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Button Glow -->
  <circle cx="50" cy="70" r="4" fill="rgba(0, 255, 153, 0.9)" filter="url(#glow)">
    <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Phone Signal -->
  <path d="M40,30 C40,20 60,20 60,30" fill="none" stroke="rgba(0, 153, 255, 0.7)" stroke-width="2">
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M35,35 C35,15 65,15 65,35" fill="none" stroke="rgba(0, 255, 153, 0.5)" stroke-width="1.5">
    <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Floating Particles -->
  <circle cx="25" cy="40" r="3" fill="rgba(0, 255, 153, 0.8)">
    <animate attributeName="cy" values="40;35;40" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="75" cy="40" r="3" fill="rgba(255, 255, 255, 0.8)">
    <animate attributeName="cy" values="40;45;40" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="85" r="4" fill="rgba(0, 153, 255, 0.9)">
    <animate attributeName="cy" values="85;90;85" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="4;6;4" dur="3.5s" repeatCount="indefinite" />
  </circle>
</svg>
