<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e30" />
      <stop offset="100%" stop-color="#00cc80" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff99" stop-opacity="0.8" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradient)" />

  <!-- Central Gear -->
  <g id="centralGear" transform="translate(400,200)">
    <circle r="90" fill="url(#glowGradient)" />
    <circle r="80" fill="#1e1e30" stroke="#00ff99" stroke-width="2" />
    <g fill="#00ff99" transform="rotate(0)">
      <path d="M-10 -80 L10 -80 L15 -100 L-15 -100 Z" />
      <path d="M-10 80 L10 80 L15 100 L-15 100 Z" />
      <path d="M-80 -10 L-80 10 L-100 15 L-100 -15 Z" />
      <path d="M80 -10 L80 10 L100 15 L100 -15 Z" />
    </g>
  </g>

  <!-- Orbiting Nodes -->
  <g id="orbitingNodes">
    <circle cx="400" cy="50" r="10" fill="#ffeb3b" stroke="#fff" stroke-width="2">
      <animateTransform 
        attributeName="transform"
        type="rotate"
        from="0 400 200"
        to="360 400 200"
        dur="6.18s"
        repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="350" r="10" fill="#00cc80" stroke="#fff" stroke-width="2">
      <animateTransform 
        attributeName="transform"
        type="rotate"
        from="360 400 200"
        to="0 400 200"
        dur="6.18s"
        repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Flowing Lines -->
  <path d="M0,300 Q400,100 800,300" fill="none" stroke="#00ff99" stroke-width="2" stroke-dasharray="10,10">
    <animate 
      attributeName="stroke-dashoffset" 
      from="0" 
      to="-20" 
      dur="6.18s" 
      repeatCount="indefinite" />
  </path>
  <path d="M0,100 Q400,300 800,100" fill="none" stroke="#ffeb3b" stroke-width="2" stroke-dasharray="15,15">
    <animate 
      attributeName="stroke-dashoffset" 
      from="0" 
      to="20" 
      dur="6.18s" 
      repeatCount="indefinite" />
  </path>

  <!-- Rotating Outer Circle -->
  <circle cx="400" cy="200" r="150" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,5">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 400 200" 
      to="360 400 200" 
      dur="6.18s" 
      repeatCount="indefinite" />
  </circle>

  <!-- Pulsing Glow -->
  <circle cx="400" cy="200" r="80" fill="url(#glowGradient)">
    <animate 
      attributeName="r" 
      values="80;90;80" 
      dur="6.18s" 
      repeatCount="indefinite" />
  </circle>
</svg>
