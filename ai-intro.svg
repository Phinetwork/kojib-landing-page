<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#backgroundGradient)" />

  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e30" />
      <stop offset="100%" stop-color="#2e2e4f" />
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Connection Gradient -->
    <linearGradient id="connectionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ccff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>
  </defs>

  <!-- Central AI Core -->
  <g transform="translate(600, 300)">
    <circle r="100" fill="url(#glowGradient)" />
    <circle r="80" fill="#00ffcc" stroke="#0099ff" stroke-width="5">
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="10" text-anchor="middle" font-family="'Arial', sans-serif" font-size="20" fill="#ffffff">AI Core</text>
  </g>

  <!-- Connections -->
  <g>
    <line x1="600" y1="300" x2="300" y2="150" stroke="url(#connectionGradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="600" y1="300" x2="900" y2="150" stroke="url(#connectionGradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="600" y1="300" x2="300" y2="450" stroke="url(#connectionGradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="600" y1="300" x2="900" y2="450" stroke="url(#connectionGradient)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Icon: Speech Recognition -->
  <g transform="translate(300, 150)">
    <circle r="40" fill="url(#glowGradient)" />
    <circle r="30" fill="#00ccff" />
    <text x="0" y="5" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff">Speech</text>
  </g>

  <!-- Icon: Vision -->
  <g transform="translate(900, 150)">
    <circle r="40" fill="url(#glowGradient)" />
    <circle r="30" fill="#ff66cc" />
    <text x="0" y="5" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff">Vision</text>
  </g>

  <!-- Icon: Decision Making -->
  <g transform="translate(300, 450)">
    <circle r="40" fill="url(#glowGradient)" />
    <circle r="30" fill="#ffcc00" />
    <text x="0" y="5" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff">Decision</text>
  </g>

  <!-- Icon: Translation -->
  <g transform="translate(900, 450)">
    <circle r="40" fill="url(#glowGradient)" />
    <circle r="30" fill="#66ff66" />
    <text x="0" y="5" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff">Translate</text>
  </g>

  <!-- Pulsing Animation for Connections -->
  <circle cx="600" cy="300" r="150" fill="none" stroke="url(#glowGradient)" stroke-width="2">
    <animate attributeName="r" values="150;160;150" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
