<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .scalability-node {
      fill: url(#node-gradient);
      stroke: #ffffff;
      stroke-width: 0.5;
      animation: pulse 3.14s infinite ease-in-out;
    }

    .scalability-line {
      stroke: #00cc80;
      stroke-width: 1.5;
      stroke-linecap: round;
      animation: connect 6.18s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.618); /* Golden ratio scaling */
        opacity: 0.8;
      }
    }

    @keyframes connect {
      0% {
        stroke-dasharray: 0, 40;
      }
      50% {
        stroke-dasharray: 20, 20;
      }
      100% {
        stroke-dasharray: 40, 0;
      }
    }

    #node-gradient {
      gradientTransform: rotate(45deg);
    }
  </style>

  <defs>
    <radialGradient id="node-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00cc80" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00cc80" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- Central Node -->
  <circle class="scalability-node" cx="100" cy="100" r="6" />

  <!-- Connections -->
  <line class="scalability-line" x1="100" y1="100" x2="50" y2="50" />
  <line class="scalability-line" x1="100" y1="100" x2="150" y2="50" />
  <line class="scalability-line" x1="100" y1="100" x2="50" y2="150" />
  <line class="scalability-line" x1="100" y1="100" x2="150" y2="150" />
  <line class="scalability-line" x1="100" y1="100" x2="100" y2="50" />

  <!-- Outer Nodes -->
  <circle class="scalability-node" cx="50" cy="50" r="4" />
  <circle class="scalability-node" cx="150" cy="50" r="4" />
  <circle class="scalability-node" cx="50" cy="150" r="4" />
  <circle class="scalability-node" cx="150" cy="150" r="4" />
  <circle class="scalability-node" cx="100" cy="50" r="4" />
</svg>
