<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .scalability-node {
      fill: #00cc80;
      animation: pulse 2s infinite ease-in-out;
    }

    .scalability-line {
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linecap: round;
      animation: connect 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.8;
      }
    }

    @keyframes connect {
      0% {
        stroke-dasharray: 0, 20;
      }
      50% {
        stroke-dasharray: 10, 10;
      }
      100% {
        stroke-dasharray: 20, 0;
      }
    }
  </style>

  <!-- Center Node -->
  <circle class="scalability-node" cx="50" cy="50" r="4" />

  <!-- Connections -->
  <line class="scalability-line" x1="50" y1="50" x2="20" y2="20" />
  <line class="scalability-line" x1="50" y1="50" x2="80" y2="20" />
  <line class="scalability-line" x1="50" y1="50" x2="20" y2="80" />
  <line class="scalability-line" x1="50" y1="50" x2="80" y2="80" />

  <!-- Outer Nodes -->
  <circle class="scalability-node" cx="20" cy="20" r="3" />
  <circle class="scalability-node" cx="80" cy="20" r="3" />
  <circle class="scalability-node" cx="20" cy="80" r="3" />
  <circle class="scalability-node" cx="80" cy="80" r="3" />
</svg>
