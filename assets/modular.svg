<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .module {
      fill: url(#module-gradient);
      stroke: #ffffff;
      stroke-width: 1;
      opacity: 0.9;
      transform-origin: center;
      animation: fadeInOut 6.18s infinite ease-in-out;
    }

    .connector {
      fill: none;
      stroke: #2e8ee5;
      stroke-width: 2;
      stroke-linecap: round;
      animation: draw 6.18s infinite ease-in-out;
    }

    @keyframes fadeInOut {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.618); /* Golden ratio scaling */
        opacity: 1;
      }
    }

    @keyframes draw {
      0% {
        stroke-dasharray: 0, 100;
        opacity: 0;
      }
      50% {
        stroke-dasharray: 50, 50;
        opacity: 1;
      }
      100% {
        stroke-dasharray: 100, 0;
        opacity: 0;
      }
    }

    #module-gradient {
      gradientTransform: rotate(45deg);
    }
  </style>

  <defs>
    <radialGradient id="module-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e8ee5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2e8ee5" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- Center Module -->
  <rect class="module" x="90" y="90" width="30" height="30" rx="5" />

  <!-- Surrounding Modules -->
  <rect class="module" x="40" y="90" width="25" height="25" rx="4" />
  <rect class="module" x="135" y="90" width="25" height="25" rx="4" />
  <rect class="module" x="90" y="40" width="25" height="25" rx="4" />
  <rect class="module" x="90" y="135" width="25" height="25" rx="4" />

  <!-- Connectors -->
  <line class="connector" x1="105" y1="105" x2="52.5" y2="102.5" />
  <line class="connector" x1="105" y1="105" x2="152.5" y2="102.5" />
  <line class="connector" x1="105" y1="105" x2="102.5" y2="52.5" />
  <line class="connector" x1="105" y1="105" x2="102.5" y2="152.5" />
</svg>
