<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .module {
      fill: #2e8ee5;
      opacity: 0.9;
      transform-origin: center;
      animation: fadeInOut 4s infinite ease-in-out;
    }

    .connector {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linecap: round;
      animation: draw 4s infinite ease-in-out;
    }

    @keyframes fadeInOut {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    @keyframes draw {
      0% {
        stroke-dasharray: 0, 100;
        opacity: 0;
      }
      50% {
        stroke-dasharray: 50, 50;
        opacity: 1;
      }
      100% {
        stroke-dasharray: 100, 0;
        opacity: 0;
      }
    }
  </style>

  <!-- Center Module -->
  <rect class="module" x="40" y="40" width="20" height="20" rx="3" />

  <!-- Surrounding Modules -->
  <rect class="module" x="20" y="40" width="15" height="15" rx="2" />
  <rect class="module" x="65" y="40" width="15" height="15" rx="2" />
  <rect class="module" x="40" y="20" width="15" height="15" rx="2" />
  <rect class="module" x="40" y="65" width="15" height="15" rx="2" />

  <!-- Connectors -->
  <line class="connector" x1="50" y1="50" x2="27.5" y2="47.5" />
  <line class="connector" x1="50" y1="50" x2="72.5" y2="47.5" />
  <line class="connector" x1="50" y1="50" x2="47.5" y2="27.5" />
  <line class="connector" x1="50" y1="50" x2="47.5" y2="72.5" />
</svg>
