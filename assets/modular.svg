<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <style>
    .module {
      fill: url(#module-gradient);
      stroke: #ffffff;
      stroke-width: 1;
      opacity: 0.9;
      transform-origin: center;
      animation: fadeInOut var(--fade-time) cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    .connector {
      fill: none;
      stroke: url(#connector-gradient);
      stroke-width: 2.5;
      stroke-linecap: round;
      animation: draw var(--draw-time) cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    @keyframes fadeInOut {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.618);
        opacity: 1;
      }
    }

    @keyframes draw {
      0% {
        stroke-dasharray: 0, 150;
        opacity: 0;
      }
      50% {
        stroke-dasharray: 75, 75;
        opacity: 1;
      }
      100% {
        stroke-dasharray: 150, 0;
        opacity: 0;
      }
    }

    #module-gradient {
      gradientTransform: rotate(45deg);
    }

    #connector-gradient {
      x1: 0%;
      y1: 0%;
      x2: 100%;
      y2: 100%;
    }
  </style>

  <defs>
    <radialGradient id="module-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e8ee5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2e8ee5" stop-opacity="0.8" />
    </radialGradient>

    <linearGradient id="connector-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e8ee5" />
      <stop offset="100%" stop-color="#00ccff" />
    </linearGradient>
  </defs>

  <!-- Center Module -->
  <rect class="module" x="190" y="190" width="40" height="40" rx="8" style="--fade-time: 5.618s;" />

  <!-- Surrounding Modules -->
  <rect class="module" x="90" y="190" width="30" height="30" rx="6" style="--fade-time: 4.14s;" />
  <rect class="module" x="290" y="190" width="30" height="30" rx="6" style="--fade-time: 6.18s;" />
  <rect class="module" x="190" y="90" width="30" height="30" rx="6" style="--fade-time: 5.14s;" />
  <rect class="module" x="190" y="290" width="30" height="30" rx="6" style="--fade-time: 6.618s;" />

  <!-- Connectors -->
  <line class="connector" x1="210" y1="210" x2="105" y2="205" style="--draw-time: 7.236s;" />
  <line class="connector" x1="210" y1="210" x2="305" y2="205" style="--draw-time: 8.14s;" />
  <line class="connector" x1="210" y1="210" x2="205" y2="105" style="--draw-time: 6.18s;" />
  <line class="connector" x1="210" y1="210" x2="205" y2="305" style="--draw-time: 7.618s;" />
</svg>
