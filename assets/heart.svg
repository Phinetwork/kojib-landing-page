<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <!-- Gradient for Heart Coloring -->
    <radialGradient id="heartGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="1" />
      <stop offset="100%" stop-color="#990000" stop-opacity="1" />
    </radialGradient>

    <!-- Glow Effect -->
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8080" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#heartGlow)">
    <animate attributeName="r" from="90" to="95" dur="1.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="0.5" to="0.2" dur="1.618s" repeatCount="indefinite" />
  </circle>

  <!-- Heart Shape -->
  <path d="M100 30 
           C 70 15, 20 50, 50 100 
           A 30 30, 0, 1, 1, 100 140 
           A 30 30, 0, 1, 1, 150 100 
           C 180 50, 130 15, 100 30Z"
        fill="url(#heartGradient)" stroke="#800000" stroke-width="2">
    <!-- Beating Animation -->
    <animateTransform attributeName="transform" type="scale"
                      values="1 1; 1.05 1.05; 1 1" dur="1.618s" repeatCount="indefinite" />
  </path>

  <!-- Inner Pulsating Glow -->
  <circle cx="100" cy="100" r="10" fill="#ff4d4d" opacity="0.8">
    <animate attributeName="r" from="10" to="15" dur="1.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="0.8" to="0.4" dur="1.618s" repeatCount="indefinite" />
  </circle>

  <!-- Vein-like Effect -->
  <path d="M75 70 C 90 50, 110 50, 125 70" stroke="#ff8080" stroke-width="2" fill="none">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -2; 0 0" dur="1.618s" repeatCount="indefinite" />
  </path>
  <path d="M75 130 C 90 150, 110 150, 125 130" stroke="#ff8080" stroke-width="2" fill="none">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 2; 0 0" dur="1.618s" repeatCount="indefinite" />
  </path>

  <!-- Pulse Effect on Entire Heart -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#ff4d4d" stroke-width="1" opacity="0.4">
    <animate attributeName="r" from="80" to="85" dur="1.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="0.4" to="0.2" dur="1.618s" repeatCount="indefinite" />
  </circle>
</svg>