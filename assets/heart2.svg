<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <!-- Gradient for Heart Coloring -->
    <radialGradient id="heartGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.8)" />
      <stop offset="100%" stop-color="rgba(0, 255, 153, 0.8)" />
    </radialGradient>

    <!-- Glow Effect -->
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.7)" />
      <stop offset="100%" stop-color="rgba(0, 153, 255, 0)" />
    </radialGradient>

    <!-- Soft Glow -->
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#heartGlow)" opacity="0.5">
    <animate attributeName="r" values="90; 92; 95; 90" dur="2.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5; 0.6; 0.3; 0.5" dur="2.618s" repeatCount="indefinite" />
  </circle>

  <!-- Heart Shape -->
  <path d="M100 40 
           C 70 10, 10 70, 100 160 
           C 190 70, 130 10, 100 40Z"
        fill="url(#heartGradient)" stroke="rgba(255, 255, 255, 0.8)" stroke-width="3" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="scale"
                      values="1 1; 1.03 1.05; 1 1" 
                      dur="3.236s" repeatCount="indefinite" additive="sum" />
  </path>

  <!-- Inner Pulsating Core -->
  <circle cx="100" cy="100" r="10" fill="rgba(0, 255, 153, 0.8)" opacity="0.8">
    <animate attributeName="r" values="10; 14; 10; 12; 10" dur="2.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8; 0.6; 0.4; 0.6; 0.8" dur="2.618s" repeatCount="indefinite" />
  </circle>

  <!-- Lum-Dump Effect -->
  <circle cx="100" cy="100" r="30" fill="rgba(0, 255, 153, 0.2)">
    <animate attributeName="r" values="30; 35; 30" dur="2.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 0.4; 0.2" dur="2.618s" repeatCount="indefinite" />
  </circle>

  <!-- Vein-like Effect -->
  <path d="M80 60 C 100 40, 120 40, 140 60" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2" fill="none">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -3; 0 3; 0 0" dur="2.618s" repeatCount="indefinite" />
  </path>
  <path d="M60 130 C 90 150, 110 150, 140 130" stroke="rgba(0, 255, 153, 0.6)" stroke-width="2" fill="none">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 3; 0 -3; 0 0" dur="2.618s" repeatCount="indefinite" />
  </path>

  <!-- Outer Pulse Effect -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(0, 255, 153, 0.4)" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="85; 88; 90; 85" dur="3.618s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4; 0.3; 0.2; 0.4" dur="3.618s" repeatCount="indefinite" />
  </circle>
</svg>
