<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <style>
    .cart {
      fill: url(#cart-gradient);
      stroke: #ffffff;
      stroke-width: 1;
      transform-origin: center;
      animation: bounce 4.236s infinite cubic-bezier(0.42, 0, 0.58, 1);
    }

    .path {
      fill: none;
      stroke: url(#path-gradient);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 400;
      animation: draw 8.236s infinite cubic-bezier(0.42, 0, 0.58, 1);
    }

    .checkout-btn {
      fill: url(#button-gradient);
      stroke: #e3b341;
      stroke-width: 1.5;
      transform-origin: center;
      animation: pulse 5.14s infinite cubic-bezier(0.42, 0, 0.58, 1);
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes draw {
      0% {
        stroke-dashoffset: 400;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.618);
        opacity: 1;
      }
    }
  </style>

  <defs>
    <radialGradient id="cart-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3b341" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0.8" />
    </radialGradient>

    <linearGradient id="path-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3b341" />
      <stop offset="100%" stop-color="#ffc107" />
    </linearGradient>

    <linearGradient id="button-gradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>
  </defs>

  <!-- Dynamic Paths -->
  <path class="path" d="M 80,150 Q 200,50 320,150" />
  <path class="path" d="M 80,250 Q 200,350 320,250" />

  <!-- Shopping Carts -->
  <rect class="cart" x="60" y="140" width="40" height="40" rx="10" />
  <rect class="cart" x="300" y="220" width="40" height="40" rx="10" />

  <!-- Checkout Button -->
  <rect class="checkout-btn" x="180" y="300" width="80" height="40" rx="10" />
  <text x="220" y="325" font-family="Arial" font-size="12" fill="#e3b341" text-anchor="middle">Checkout</text>
</svg>
