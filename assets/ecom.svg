<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .cart {
      fill: #e3b341;
      transform-origin: center;
      animation: bounce 3s infinite ease-in-out;
    }

    .path {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 200;
      animation: draw 4s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes draw {
      0% {
        stroke-dashoffset: 200;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <!-- Paths -->
  <path class="path" d="M 20,40 Q 50,10 80,40" />
  <path class="path" d="M 20,60 Q 50,90 80,60" />

  <!-- Shopping Carts -->
  <rect class="cart" x="15" y="35" width="10" height="10" rx="2" />
  <rect class="cart" x="75" y="55" width="10" height="10" rx="2" />
</svg>
