<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .cart {
      fill: url(#cart-gradient);
      transform-origin: center;
      animation: bounce 3s infinite ease-in-out;
    }

    .path {
      fill: none;
      stroke: #e3b341;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 300;
      animation: draw 6.18s infinite ease-in-out;
    }

    .checkout-btn {
      fill: #ffffff;
      stroke: #e3b341;
      stroke-width: 1;
      opacity: 0.9;
      transform-origin: center;
      animation: pulse 3.14s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes draw {
      0% {
        stroke-dashoffset: 300;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.618);
        opacity: 1;
      }
    }

    #cart-gradient {
      gradientTransform: rotate(45deg);
    }
  </style>

  <defs>
    <radialGradient id="cart-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3b341" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- Paths -->
  <path class="path" d="M 40,80 Q 100,20 160,80" />
  <path class="path" d="M 40,120 Q 100,180 160,120" />

  <!-- Shopping Carts -->
  <rect class="cart" x="30" y="70" width="20" height="20" rx="4" />
  <rect class="cart" x="150" y="110" width="20" height="20" rx="4" />

  <!-- Checkout Button -->
  <rect class="checkout-btn" x="80" y="140" width="40" height="20" rx="5" />
  <text x="100" y="155" font-family="Arial" font-size="8" fill="#e3b341" text-anchor="middle">Checkout</text>
</svg>
