<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .decision-path {
      stroke: #00cc80;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      animation: dash 6.18s infinite ease-in-out;
    }

    .decision-node {
      fill: url(#node-gradient);
      stroke: #ffffff;
      stroke-width: 0.5;
      animation: pulse 3.14s infinite ease-in-out;
    }

    .connector-line {
      stroke: #00ff99;
      stroke-width: 1;
      stroke-dasharray: 4;
      opacity: 0.7;
      animation: glow 2s infinite linear;
    }

    @keyframes dash {
      0% {
        stroke-dasharray: 5, 15;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 15, 5;
        stroke-dashoffset: -10;
      }
      100% {
        stroke-dasharray: 5, 15;
        stroke-dashoffset: -20;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.618); /* Phi ratio scaling */
      }
    }

    @keyframes glow {
      0%, 100% {
        opacity: 0.7;
        filter: drop-shadow(0 0 4px #00ff99);
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 12px #00cc80);
      }
    }
  </style>

  <defs>
    <radialGradient id="node-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00cc80" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00cc80" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- Decision Path -->
  <path
    class="decision-path"
    d="M20 50 Q60 20, 100 70 T180 130"
  />

  <!-- Connecting Lines -->
  <line class="connector-line" x1="20" y1="50" x2="60" y2="90" />
  <line class="connector-line" x1="100" y1="70" x2="140" y2="110" />

  <!-- Decision Nodes -->
  <circle class="decision-node" cx="20" cy="50" r="5" />
  <circle class="decision-node" cx="100" cy="70" r="7" />
  <circle class="decision-node" cx="180" cy="130" r="9" />
</svg>
