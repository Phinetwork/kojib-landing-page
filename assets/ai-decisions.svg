<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .route-path {
      stroke: #00cc80;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      animation: dash 3s infinite linear;
    }

    .route-node {
      fill: #ffffff;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes dash {
      0% {
        stroke-dasharray: 1, 10;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 10, 1;
        stroke-dashoffset: -10;
      }
      100% {
        stroke-dasharray: 1, 10;
        stroke-dashoffset: -20;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }
  </style>

  <!-- Routing Path -->
  <path
    class="route-path"
    d="M10 20 Q30 10, 50 30 T90 50"
  />

  <!-- Nodes -->
  <circle class="route-node" cx="10" cy="20" r="2" />
  <circle class="route-node" cx="50" cy="30" r="3" />
  <circle class="route-node" cx="90" cy="50" r="4" />
</svg>
