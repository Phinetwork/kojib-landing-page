<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .node {
      fill: #ff6f61;
      animation: pulse 2s infinite ease-in-out;
    }

    .connection {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linecap: round;
      animation: connect 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }

    @keyframes connect {
      0% {
        stroke-dasharray: 0, 100;
      }
      100% {
        stroke-dasharray: 100, 0;
      }
    }
  </style>

  <!-- Connections -->
  <line class="connection" x1="30" y1="50" x2="50" y2="30" />
  <line class="connection" x1="50" y1="30" x2="70" y2="50" />
  <line class="connection" x1="70" y1="50" x2="50" y2="70" />
  <line class="connection" x1="50" y1="70" x2="30" y2="50" />

  <!-- Nodes -->
  <circle class="node" cx="30" cy="50" r="4" />
  <circle class="node" cx="50" cy="30" r="4" />
  <circle class="node" cx="70" cy="50" r="4" />
  <circle class="node" cx="50" cy="70" r="4" />
</svg>
