<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kojib Scheduler</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
  
  <!-- Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>
  
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #121212; /* Dark Background */
      color: #e0e0e0; /* Light Gray Text */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 20px;
    }

    .container {
      background: #1e1e1e; /* Darker Container Background */
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      animation: fadeIn 1s ease-in-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================================
               Navigation
    ================================= */
    .nav {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }

    .nav .back-button {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(45deg, #81c784, #66bb6a);
      border: none;
      border-radius: 50px;
      padding: 10px 15px;
      color: #1c313a;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }

    .nav .back-button:hover {
      background: #66bb6a;
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
    }

    /* ================================
               Header
    ================================= */
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 40px; /* To avoid overlap with navigation */
    }

    .header img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin-bottom: 10px;
      object-fit: cover;
    }

    .header h1 {
      font-family: 'Roboto Slab', serif;
      font-size: 2rem;
      color: #81c784; /* Light Emerald Green */
      margin-bottom: 5px;
    }

    .header p {
      font-size: 0.95rem;
      color: #b0bec5; /* Lighter Gray Text */
    }

    /* ================================
               Progress Bar
    ================================= */
    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .progress-step {
      width: 20%;
      text-align: center;
      position: relative;
      font-size: 0.8rem;
      color: #90a4ae; /* Gray */
    }

    .progress-step::before {
      content: '';
      display: block;
      width: 30px;
      height: 30px;
      margin: 0 auto 5px;
      border-radius: 50%;
      background: #90a4ae; /* Gray */
      transition: background 0.3s, transform 0.3s;
    }

    .progress-step.active::before {
      background: #81c784; /* Light Emerald Green */
      transform: scale(1.2);
    }

    /* ================================
               Chat Container
    ================================= */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
      max-height: 300px; /* Fixed height */
      margin-bottom: 20px;
      border-radius: 10px;
      background: #263238; /* Dark Slate Gray */
      padding: 15px;
      border: 1px solid #37474f; /* Dark Border */
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .message {
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 20px;
      max-width: 80%;
      position: relative;
      animation: slideIn 0.3s ease-out;
      word-wrap: break-word;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .bot-message {
      background: #81c784; /* Light Emerald Green */
      color: #1c313a; /* Dark Text */
      align-self: flex-start;
      border-bottom-left-radius: 0;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }

    .user-message {
      background: #29b6f6; /* Light Blue */
      color: #ffffff; /* White Text */
      align-self: flex-end;
      border-bottom-right-radius: 0;
      box-shadow: -2px 2px 5px rgba(0, 0, 0, 0.3);
    }

    /* ================================
               Input Box
    ================================= */
    .input-box {
      display: flex;
      flex-direction: column;
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-box input,
    .input-box select,
    .input-box button {
      margin-top: 10px;
      padding: 12px 20px;
      border-radius: 30px;
      border: 1px solid #546e7a; /* Dark Gray Border */
      background: #37474f; /* Dark Background */
      color: #eceff1; /* Light Text */
      font-size: 16px;
      transition: border-color 0.3s, background 0.3s, transform 0.2s;
      width: 100%;
    }

    .input-box input::placeholder,
    .input-box select::placeholder {
      color: #78909c; /* Placeholder Gray */
    }

    .input-box input:focus,
    .input-box select:focus {
      outline: none;
      border-color: #81c784; /* Light Emerald Green Border */
      background: #455a64; /* Slightly Lighter Dark Background */
    }

    .input-box button {
      background: #81c784; /* Light Emerald Green Background */
      color: #1c313a; /* Dark Text */
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      border: none;
    }

    .input-box button:hover {
      background: #66bb6a; /* Darker Emerald Green */
      transform: translateY(-2px);
    }

    /* ================================
               Success Message
    ================================= */
    .success-message {
      text-align: center;
      color: #66bb6a; /* Green Success */
      margin-top: 20px;
      font-size: 1rem;
      animation: fadeIn 1s ease-in-out;
    }

    /* ================================
               Scrollbar Styling
    ================================= */
    .chat-container::-webkit-scrollbar {
      width: 8px;
    }

    .chat-container::-webkit-scrollbar-track {
      background: #263238; /* Dark Slate Gray */
    }

    .chat-container::-webkit-scrollbar-thumb {
      background-color: #81c784; /* Light Emerald Green Scrollbar */
      border-radius: 4px;
    }

    /* ================================
               Navigation Styles
    ================================= */
    .nav a {
      color: #81c784;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .nav a:hover {
      color: #66bb6a;
      background: rgba(255, 255, 255, 0.2);
    }

    /* ================================
               Footer Styles
    ================================= */
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: #90a4ae;
    }

    .footer a {
      color: #81c784;
      text-decoration: none;
      margin: 0 5px;
      transition: color 0.3s;
    }

    .footer a:hover {
      color: #66bb6a;
    }

    /* ================================
               Responsive Design
    ================================= */
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .input-box input,
      .input-box select,
      .input-box button {
        font-size: 14px;
        padding: 10px 15px;
      }

      .chat-container {
        max-height: 250px; /* Adjusted for smaller screens */
      }

      .nav {
        top: 10px;
        left: 10px;
        gap: 10px;
      }

      .footer {
        font-size: 0.7rem;
      }

      .nav a {
        font-size: 0.8rem;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="chat-container">
    <!-- Navigation -->
    <div class="nav">
      <button class="back-button" onclick="history.back()" aria-label="Go Back">
        &#8592; Back
      </button>
    </div>

    <div class="header">
      <!-- Kojib Logo/Avatar -->
      <img src="/image/logo.svg" alt="Kojib Logo"> <!-- Ensure the path is correct or replace with actual Kojib logo URL -->
      <h1>Kojib Scheduler</h1>
      <p>Schedule your assessment and complete payment seamlessly.</p>
    </div>
    <div class="progress-bar">
      <div class="progress-step active">Name</div>
      <div class="progress-step">Email</div>
      <div class="progress-step">Date</div>
      <div class="progress-step">Time</div>
      <div class="progress-step">Payment</div>
    </div>
    <div class="chat-container" id="messages" aria-live="polite">
      <!-- Chat Messages will appear here -->
    </div>
    <div class="input-box" id="input-box">
      <!-- Input fields will appear here -->
    </div>
    <div class="footer">
      <a href="/terms.html">Terms</a> | <a href="/faq.html">FAQ</a>
    </div>
  </div>

  <script>
    // Initialize Stripe with your publishable key
    const stripe = Stripe('pk_live_51JC8PeCnElKewPPGtfJ0uZEs20pxZNgjtmx1c17wOah58ukuaJol6tvxJ8W4R9AXyAKd17qg9f8yLKVP94oZfcOA00FLL9QWCs'); // Replace with your actual Stripe publishable key
    const chatContainer = document.getElementById('messages');
    const inputBoxContainer = document.getElementById('input-box');
    let currentStep = 0;
    const userInputs = {};

    const typingSpeed = 10; // Milliseconds per character

    // Define the payment amount (in cents) and display value
    const PRICE_AMOUNT = 100000; // $1,000.00
    const PRICE_CURRENCY = 'usd';
    const PRICE_DISPLAY = '$1,000.00';

    const steps = [
      {
        question: "👋 Let’s schedule your initial assessment. What’s your name?",
        inputType: "text",
        key: "name",
        placeholder: "Enter your full name"
      },
      {
        question: "📧 Thanks! What’s your email address so we can confirm the details?",
        inputType: "email",
        key: "email",
        placeholder: "Enter your email"
      },
      {
        question: "📅 Please select a date for your assessment.",
        inputType: "date",
        key: "date",
        placeholder: "Select a date"
      },
      {
        question: "🕒 Great! Now select a time slot.",
        inputType: "select",
        key: "time",
        options: ["9:00 AM", "11:00 AM", "1:00 PM", "3:00 PM"]
      },
      {
        question: `💳 A payment of ${PRICE_DISPLAY} is required to confirm your assessment. Please provide your payment details to secure your appointment.`,
        inputType: "payment",
      }
    ];

    // Function to create and display messages with typing effect for bot messages
    function createMessage(content, isBot = true) {
      return new Promise((resolve) => {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', isBot ? 'bot-message' : 'user-message');
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        if (isBot) {
          let index = 0;
          const typingInterval = setInterval(() => {
            messageDiv.textContent += content.charAt(index);
            index++;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            if (index === content.length) {
              clearInterval(typingInterval);
              resolve();
            }
          }, typingSpeed);
        } else {
          messageDiv.textContent = content;
          resolve();
        }
      });
    }

    // Function to update the progress bar
    function updateProgressBar(step) {
      const progressSteps = document.querySelectorAll('.progress-step');
      progressSteps.forEach((prog, index) => {
        if (index <= step) {
          prog.classList.add('active');
        } else {
          prog.classList.remove('active');
        }
      });
    }

    // Function to create input fields based on the current step
    function createInputField(step) {
      inputBoxContainer.innerHTML = ''; // Clear previous input

      if (step.inputType === 'payment') {
        // Create Stripe Elements form without additional message
        const form = document.createElement('form');
        form.id = 'payment-form';
        form.innerHTML = `
          <div id="card-element" style="padding: 10px; border: 1px solid #546e7a; border-radius: 5px;"></div>
          <div id="card-errors" role="alert" style="color: #ef5350; margin-top: 10px;"></div>
          <button type="submit" style="margin-top: 20px; padding: 12px 20px; border-radius: 30px; border: none; background: #81c784; color: #1c313a; font-weight: 600; cursor: pointer;">Book Assessment</button>
        `;
        inputBoxContainer.appendChild(form);

        // Initialize Stripe Elements
        const elements = stripe.elements();
        const style = {
          base: {
            color: '#eceff1',
            fontFamily: '"Inter", sans-serif',
            fontSmoothing: 'antialiased',
            fontSize: '16px',
            '::placeholder': {
              color: '#78909c'
            }
          },
          invalid: {
            color: '#ef5350',
            iconColor: '#ef5350'
          }
        };

        const card = elements.create('card', { style: style });
        card.mount('#card-element');

        // Handle real-time validation errors from the card Element.
        card.on('change', function(event) {
          const displayError = document.getElementById('card-errors');
          if (event.error) {
            displayError.textContent = event.error.message;
          } else {
            displayError.textContent = '';
          }
        });

        // Handle form submission
        form.addEventListener('submit', async function(event) {
          event.preventDefault();
          const submitButton = form.querySelector('button[type="submit"]');
          submitButton.disabled = true;
          submitButton.textContent = 'Processing...';

          // Create PaymentMethod using Stripe.js
          const { error, paymentMethod } = await stripe.createPaymentMethod({
            type: 'card',
            card: card,
            billing_details: {
              name: userInputs.name,
              email: userInputs.email,
            },
          });

          if (error) {
            // Show error in payment form
            const errorElement = document.getElementById('card-errors');
            errorElement.textContent = error.message;
            submitButton.disabled = false;
            submitButton.textContent = `Pay ${PRICE_DISPLAY}`;
          } else {
            // Send paymentMethod.id and appointmentData to the backend
            try {
              const response = await fetch('https://payment-backend-2dl3.onrender.com/api/process-payment', { // Replace with your actual backend endpoint
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  paymentMethodId: paymentMethod.id,
                  amount: PRICE_AMOUNT,
                  appointmentData: {
                    name: userInputs.name,
                    email: userInputs.email,
                    date: userInputs.date,
                    time: userInputs.time,
                  },
                }),
              });

              const result = await response.json();

              if (response.ok && result.success) {
                // Payment successful
                await createMessage("✅ Your payment was successful! Your appointment is confirmed.", true);
                inputBoxContainer.innerHTML = ''; // Clear input after success
                updateProgressBar(currentStep);
                currentStep++;
                finalizeProcess();
              } else {
                // Payment failed
                const errorMsg = result.error || "An error occurred during payment.";
                await createMessage(`❌ ${errorMsg}`, true);
                submitButton.disabled = false;
                submitButton.textContent = `Pay ${PRICE_DISPLAY}`;
              }
            } catch (err) {
              console.error(err);
              await createMessage("❌ Failed to process your payment. Please try again.", true);
              submitButton.disabled = false;
              submitButton.textContent = `Pay ${PRICE_DISPLAY}`;
            }
          }
        });

      } else {
        let inputElement;

        if (step.inputType === 'text' || step.inputType === 'email' || step.inputType === 'date') {
          inputElement = document.createElement('input');
          inputElement.type = step.inputType;
          inputElement.placeholder = step.placeholder || '';
          inputElement.required = true;
          inputElement.setAttribute('aria-label', step.placeholder || '');
          inputBoxContainer.appendChild(inputElement);
        } else if (step.inputType === 'select') {
          inputElement = document.createElement('select');
          inputElement.required = true;
          inputElement.setAttribute('aria-label', 'Select an option');
          const defaultOption = document.createElement('option');
          defaultOption.value = "";
          defaultOption.textContent = "Select an option";
          defaultOption.disabled = true;
          defaultOption.selected = true;
          inputElement.appendChild(defaultOption);
          step.options.forEach(option => {
            const opt = document.createElement('option');
            opt.value = option;
            opt.textContent = option;
            inputElement.appendChild(opt);
          });
          inputBoxContainer.appendChild(inputElement);
        }

        // Create Submit button
        const submitButton = document.createElement('button');
        submitButton.textContent = 'Submit';
        submitButton.type = 'button';
        submitButton.onclick = () => {
          submitInput();
        };
        inputBoxContainer.appendChild(submitButton);

        // Add event listener for Enter key
        if (inputElement) {
          inputElement.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
              event.preventDefault();
              submitInput();
            }
          });
        }

        // Function to handle input submission
        function submitInput() {
          if (step.inputType === 'payment') {
            // Should not reach here; payment is handled separately
            return;
          } else {
            if (inputElement && inputElement.value.trim()) {
              userInputs[step.key] = inputElement.value;
              createMessage(inputElement.value, false).then(() => {
                inputBoxContainer.innerHTML = ''; // Clear input after submission
                nextStep();
              });
            } else {
              alert('🔔 Please fill out the field before submitting.');
            }
          }
        }
      }

    }

    // Function to finalize the process after payment
    function finalizeProcess() {
      updateProgressBar(currentStep);
      createMessage("🎉 All steps completed! Thank you for scheduling your assessment.", true);
      // Optionally, you can add a final message or redirect the user
    }

    // Asynchronous function to handle the step-by-step conversation
    async function nextStep() {
      if (currentStep < steps.length) {
        const step = steps[currentStep];
        updateProgressBar(currentStep);
        await createMessage(step.question, true);
        createInputField(step);
        currentStep++;
      } else {
        // All steps completed
        // Handled in finalizeProcess()
      }
    }

    // Start the conversation
    createMessage("👋 Hi there! I'm Kojib, your personal assistant.", true).then(() => {
      nextStep();
    });

    // Smooth scroll to bottom whenever new messages are added
    const observer = new MutationObserver(() => {
      const chatContainer = document.getElementById('messages');
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });

    observer.observe(chatContainer, { childList: true, subtree: true });
  </script>
</body>
</html>
