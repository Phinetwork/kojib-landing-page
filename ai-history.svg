<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="history-title history-description">
  <title id="history-title">A Brief History of AI</title>
  <desc id="history-description">An animated timeline showcasing key milestones in AI development.</desc>

  <!-- Background -->
  <rect width="800" height="400" fill="#1e1e2e" />

  <!-- Timeline Path -->
  <path d="M50 200 Q200 50, 400 200 T750 200" fill="none" stroke="#00ccff" stroke-width="4" stroke-dasharray="10 5"/>

  <!-- Milestones -->
  <!-- 1956 -->
  <circle cx="50" cy="200" r="10" fill="#00ccff">
    <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="50" y="180" fill="#ffffff" font-size="12" text-anchor="middle">1956</text>
  <text x="50" y="220" fill="#ffffff" font-size="12" text-anchor="middle">Dartmouth Conf.</text>

  <!-- 1960s-70s -->
  <circle cx="200" cy="100" r="10" fill="#00ffcc">
    <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="200" y="80" fill="#ffffff" font-size="12" text-anchor="middle">1960s-70s</text>
  <text x="200" y="120" fill="#ffffff" font-size="12" text-anchor="middle">ELIZA, Shakey</text>

  <!-- 1980s -->
  <circle cx="400" cy="200" r="10" fill="#ffcc00">
    <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="400" y="180" fill="#ffffff" font-size="12" text-anchor="middle">1980s</text>
  <text x="400" y="220" fill="#ffffff" font-size="12" text-anchor="middle">Machine Learning</text>

  <!-- 1997 -->
  <circle cx="600" cy="300" r="10" fill="#ff3366">
    <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="600" y="280" fill="#ffffff" font-size="12" text-anchor="middle">1997</text>
  <text x="600" y="320" fill="#ffffff" font-size="12" text-anchor="middle">Deep Blue</text>

  <!-- 2010s -->
  <circle cx="750" cy="200" r="10" fill="#00ff99">
    <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="750" y="180" fill="#ffffff" font-size="12" text-anchor="middle">2010s</text>
  <text x="750" y="220" fill="#ffffff" font-size="12" text-anchor="middle">Deep Learning</text>

  <!-- Animating Glow Effect -->
  <circle cx="50" cy="200" r="15" fill="none" stroke="#00ccff" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite" />
  </circle>

  <circle cx="200" cy="100" r="15" fill="none" stroke="#00ffcc" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite" />
  </circle>

  <circle cx="400" cy="200" r="15" fill="none" stroke="#ffcc00" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite" />
  </circle>

  <circle cx="600" cy="300" r="15" fill="none" stroke="#ff3366" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite" />
  </circle>

  <circle cx="750" cy="200" r="15" fill="none" stroke="#00ff99" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
