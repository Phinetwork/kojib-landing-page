<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#backgroundGradient)" />

  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" />
      <stop offset="100%" stop-color="#243b55" />
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
  </defs>

  <!-- Central AI Icon -->
  <circle cx="600" cy="150" r="70" fill="url(#iconGradient)" />
  <text x="600" y="155" font-family="'Arial', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Future AI
  </text>

  <!-- Trend Nodes -->
  <!-- XAI -->
  <circle cx="300" cy="300" r="60" fill="url(#glow)" />
  <circle cx="300" cy="300" r="50" fill="#0077ff" />
  <text x="300" y="300" font-family="'Arial', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Explainable AI
  </text>

  <!-- Edge AI -->
  <circle cx="600" cy="400" r="60" fill="url(#glow)" />
  <circle cx="600" cy="400" r="50" fill="#00ffcc" />
  <text x="600" y="400" font-family="'Arial', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Edge AI
  </text>

  <!-- AI in Cybersecurity -->
  <circle cx="900" cy="300" r="60" fill="url(#glow)" />
  <circle cx="900" cy="300" r="50" fill="#ff9900" />
  <text x="900" y="300" font-family="'Arial', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Cybersecurity
  </text>

  <!-- Human-AI Collaboration -->
  <circle cx="450" cy="500" r="60" fill="url(#glow)" />
  <circle cx="450" cy="500" r="50" fill="#0077ff" />
  <text x="450" y="500" font-family="'Arial', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Collaboration
  </text>

  <!-- Advancements in General AI -->
  <circle cx="750" cy="500" r="60" fill="url(#glow)" />
  <circle cx="750" cy="500" r="50" fill="#ff9900" />
  <text x="750" y="500" font-family="'Arial', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    General AI
  </text>

  <!-- Connecting Lines -->
  <line x1="600" y1="150" x2="300" y2="300" stroke="#00ffcc" stroke-width="3" />
  <line x1="600" y1="150" x2="600" y2="400" stroke="#00ffcc" stroke-width="3" />
  <line x1="600" y1="150" x2="900" y2="300" stroke="#00ffcc" stroke-width="3" />
  <line x1="600" y1="400" x2="450" y2="500" stroke="#00ffcc" stroke-width="3" />
  <line x1="600" y1="400" x2="750" y2="500" stroke="#00ffcc" stroke-width="3" />

  <!-- Animation -->
  <circle cx="600" cy="150" r="90" fill="none" stroke="url(#iconGradient)" stroke-width="3" opacity="0.5">
    <animate attributeName="r" values="90; 100; 90" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5; 0.8; 0.5" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
