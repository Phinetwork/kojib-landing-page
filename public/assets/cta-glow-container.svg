<!-- Expanded Dynamic Glow Effect with GitHub Logo -->
<div class="cta-glow-container">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="cta-glow" width="400" height="400">
    <!-- Outer Glow Rings -->
    <circle cx="200" cy="200" r="190" fill="none" stroke="#00ff99" stroke-width="2">
      <animate attributeName="r" values="190;200;190" dur="4.236s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4.236s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="200" r="170" fill="none" stroke="#0099ff" stroke-width="2">
      <animate attributeName="r" values="170;180;170" dur="3.618s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.618s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Radiating Patterns -->
    <g>
      <circle cx="200" cy="200" r="140" fill="none" stroke="#ffffff" stroke-width="1">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.618s" repeatCount="indefinite" />
      </circle>
      <circle cx="200" cy="200" r="100" fill="none" stroke="#00ffcc" stroke-width="1">
        <animate attributeName="r" values="100;105;100" dur="3.618s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.618s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Spiral Inspired by Golden Ratio -->
    <g transform="translate(200, 200)">
      <path d="M0,0 C20,10 40,30 60,50" stroke="#00ff99" stroke-width="2" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6.854s" repeatCount="indefinite" />
      </path>
      <path d="M0,0 C-20,-10 -40,-30 -60,-50" stroke="#0099ff" stroke-width="2" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="6.854s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Central Pulse with GitHub Logo -->
    <circle cx="200" cy="200" r="20" fill="#00ff99" opacity="0.7">
      <animate attributeName="r" values="20;30;20" dur="2.618s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.618s" repeatCount="indefinite" />
    </circle>
    <g transform="translate(175, 175)" opacity="0.9">
      <path fill="#ffffff" d="M25 0a25 25 0 0 0-7.9 48.7c1.3.2 1.6-.6 1.6-1.3V44.1c-6.6 1.3-8-2.8-8-2.8-1.1-2.6-2.7-3.3-2.7-3.3-2.1-1.3.2-1.3.2-1.3 2.3.3 3.6 2.5 3.6 2.5 2.1 3.7 5.3 2.6 6.6 2 .2-1.5.8-2.6 1.4-3.2-5.3-.6-10.7-2.7-10.7-12.1 0-2.8 1-5 2.5-6.7-.2-.6-1-3 .3-6.3 0 0 2.1-.7 6.8 2.5a23 23 0 0 1 13.1 0c4.6-3.2 6.7-2.5 6.7-2.5 1.3 3.3.5 5.7.3 6.3 1.5 1.7 2.5 3.8 2.5 6.7 0 9.5-5.4 11.5-10.7 12 .8.7 1.6 2.2 1.6 4.4v6.5c0 .7.3 1.6 1.6 1.3A25 25 0 0 0 25 0z"></path>
    </g>

    <!-- Particle Effects -->
    <circle cx="100" cy="100" r="3" fill="#ffffff">
      <animate attributeName="cx" values="100;300;100" dur="3.618s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;300;100" dur="3.618s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3.618s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="300" r="3" fill="#00ff99">
      <animate attributeName="cx" values="300;100;300" dur="3.618s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;100;300" dur="3.618s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3.618s" repeatCount="indefinite" />
    </circle>

    <!-- Dynamic Connecting Lines -->
    <line x1="100" y1="100" x2="300" y2="300" stroke="#ffffff" stroke-width="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.236s" repeatCount="indefinite" />
    </line>
    <line x1="300" y1="100" x2="100" y2="300" stroke="#00ffcc" stroke-width="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.236s" repeatCount="indefinite" />
    </line>
  </svg>
</div>
