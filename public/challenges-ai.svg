<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="#1c1e26" />

  <!-- Maze Structure -->
  <g id="maze">
    <rect x="150" y="100" width="500" height="200" fill="none" stroke="#6c757d" stroke-width="4" />
    <path d="M150 100 H650 V200 H400 V300 H150 Z" fill="none" stroke="#6c757d" stroke-width="4" />
  </g>

  <!-- Glowing Nodes -->
  <g id="nodes">
    <circle id="node1" cx="200" cy="150" r="8" fill="#00ccff" />
    <circle id="node2" cx="350" cy="150" r="8" fill="#00ccff" />
    <circle id="node3" cx="500" cy="150" r="8" fill="#00ccff" />
    <circle id="node4" cx="400" cy="250" r="8" fill="#00ccff" />
  </g>

  <!-- Neural Pathways -->
  <g id="paths">
    <path id="path1" d="M200 150 H350" fill="none" stroke="#00ccff" stroke-width="2" />
    <path id="path2" d="M350 150 H500" fill="none" stroke="#00ccff" stroke-width="2" />
    <path id="path3" d="M500 150 V250 H400" fill="none" stroke="#00ccff" stroke-width="2" />
  </g>

  <!-- Animations -->
  <style>
    @keyframes pulse {
      0%, 100% {
        r: 8;
        fill: #00ccff;
      }
      50% {
        r: 12;
        fill: #1e90ff;
      }
    }

    @keyframes glow {
      0%, 100% {
        stroke: #00ccff;
      }
      50% {
        stroke: #1e90ff;
      }
    }

    @keyframes move {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(200px);
      }
    }

    #nodes circle {
      animation: pulse 2.618s infinite;
    }

    #paths path {
      animation: glow 2.618s infinite;
    }

    #node1 {
      animation-delay: 0s;
    }

    #node2 {
      animation-delay: 0.618s;
    }

    #node3 {
      animation-delay: 1.236s;
    }

    #node4 {
      animation-delay: 1.854s;
    }
  </style>
</svg>
