<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#backgroundGradient)" />

  <!-- Definitions -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e30" />
      <stop offset="100%" stop-color="#2e2e4f" />
    </linearGradient>

    <!-- Node Glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.7" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Ethical AI Icon -->
    <linearGradient id="ethicalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff99" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <!-- Transparent Data Pipeline -->
    <linearGradient id="dataPipeline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
  </defs>

  <!-- Ethical AI Icon -->
  <circle cx="600" cy="100" r="60" fill="url(#ethicalGradient)" />
  <text x="600" y="105" font-family="'Arial', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Ethical AI
  </text>

  <!-- Best Practice Nodes -->
  <!-- Define Objectives -->
  <circle cx="200" cy="200" r="50" fill="url(#nodeGlow)" />
  <circle cx="200" cy="200" r="40" fill="#00ff99" />
  <text x="200" y="200" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Objectives
  </text>

  <!-- Data Quality -->
  <circle cx="600" cy="200" r="50" fill="url(#nodeGlow)" />
  <circle cx="600" cy="200" r="40" fill="#00ff99" />
  <text x="600" y="200" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Data Quality
  </text>

  <!-- Ethical Standards -->
  <circle cx="1000" cy="200" r="50" fill="url(#nodeGlow)" />
  <circle cx="1000" cy="200" r="40" fill="#00ff99" />
  <text x="1000" y="200" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Ethics
  </text>

  <!-- Multidisciplinary Collaboration -->
  <circle cx="400" cy="400" r="50" fill="url(#nodeGlow)" />
  <circle cx="400" cy="400" r="40" fill="#00ff99" />
  <text x="400" y="400" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Collaboration
  </text>

  <!-- Iterative Improvement -->
  <circle cx="800" cy="400" r="50" fill="url(#nodeGlow)" />
  <circle cx="800" cy="400" r="40" fill="#00ff99" />
  <text x="800" y="400" font-family="'Arial', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    Improve
  </text>

  <!-- Connecting Lines -->
  <line x1="600" y1="100" x2="200" y2="200" stroke="url(#dataPipeline)" stroke-width="3" />
  <line x1="600" y1="100" x2="600" y2="200" stroke="url(#dataPipeline)" stroke-width="3" />
  <line x1="600" y1="100" x2="1000" y2="200" stroke="url(#dataPipeline)" stroke-width="3" />
  <line x1="600" y1="200" x2="400" y2="400" stroke="url(#dataPipeline)" stroke-width="3" />
  <line x1="600" y1="200" x2="800" y2="400" stroke="url(#dataPipeline)" stroke-width="3" />

  <!-- Animated Glow -->
  <circle cx="600" cy="100" r="80" fill="none" stroke="url(#ethicalGradient)" stroke-width="3" opacity="0.5">
    <animate attributeName="r" values="80; 90; 80" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5; 0.8; 0.5" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Title -->
  <text x="600" y="50" font-family="'Arial', sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">
    AI Best Practices
  </text>
</svg>
