<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a0dad" />
      <stop offset="50%" stop-color="#00ccff" />
      <stop offset="100%" stop-color="#6a0dad" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="black" />

  <!-- Central Neural Node -->
  <circle cx="400" cy="200" r="15" fill="url(#ai-gradient)" filter="url(#glow)">
    <animate attributeName="r" values="10;15;10" dur="6.18s" repeatCount="indefinite" />
  </circle>

  <!-- Orbiting Dots -->
  <circle cx="400" cy="120" r="5" fill="#00ccff">
    <animateTransform attributeName="transform" type="rotate" from="0 400 200" to="360 400 200" dur="6.18s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="280" r="5" fill="#6a0dad">
    <animateTransform attributeName="transform" type="rotate" from="360 400 200" to="0 400 200" dur="6.18s" repeatCount="indefinite" />
  </circle>

  <!-- Connecting Lines -->
  <line x1="400" y1="200" x2="400" y2="120" stroke="#00ccff" stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.3;1" dur="3.09s" repeatCount="indefinite" />
  </line>
  <line x1="400" y1="200" x2="400" y2="280" stroke="#6a0dad" stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.3;1" dur="3.09s" repeatCount="indefinite" />
  </line>

  <!-- Expanding Neural Links -->
  <circle cx="400" cy="200" r="50" stroke="url(#ai-gradient)" stroke-width="2" fill="none" opacity="0.7">
    <animate attributeName="r" values="50;70;50" dur="6.18s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="200" r="90" stroke="url(#ai-gradient)" stroke-width="2" fill="none" opacity="0.5">
    <animate attributeName="r" values="90;110;90" dur="6.18s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Particles -->
  <circle cx="200" cy="100" r="3" fill="#00ccff" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0;200,100;0,200;0,0" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="300" r="3" fill="#6a0dad" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-200,-100;0,-200;0,0" dur="10s" repeatCount="indefinite" />
  </circle>
</svg>