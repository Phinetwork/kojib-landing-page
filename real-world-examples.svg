<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="url(#skyGradient)" />

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="buildingLights" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce38a" />
      <stop offset="100%" stop-color="#f38181" />
    </linearGradient>
  </defs>

  <!-- City Buildings -->
  <g id="buildings">
    <rect x="50" y="200" width="100" height="200" fill="#3e3a5b" />
    <rect x="200" y="150" width="80" height="250" fill="#4e4b72" />
    <rect x="320" y="180" width="90" height="220" fill="#3e3a5b" />
    <rect x="460" y="100" width="120" height="300" fill="#4e4b72" />
    <rect x="620" y="220" width="100" height="180" fill="#3e3a5b" />
  </g>

  <!-- Animated Lights in Windows -->
  <g id="windows">
    <rect x="60" y="220" width="10" height="10" fill="url(#buildingLights)">
      <animate attributeName="fill-opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
    </rect>
    <rect x="80" y="250" width="10" height="10" fill="url(#buildingLights)">
      <animate attributeName="fill-opacity" values="1;0;1" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="220" y="170" width="10" height="10" fill="url(#buildingLights)">
      <animate attributeName="fill-opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" />
    </rect>
    <rect x="340" y="200" width="10" height="10" fill="url(#buildingLights)">
      <animate attributeName="fill-opacity" values="1;0;1" dur="3.5s" repeatCount="indefinite" />
    </rect>
    <rect x="480" y="120" width="10" height="10" fill="url(#buildingLights)">
      <animate attributeName="fill-opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
    </rect>
    <rect x="650" y="240" width="10" height="10" fill="url(#buildingLights)">
      <animate attributeName="fill-opacity" values="1;0;1" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Connections (Animated Lines) -->
  <g id="connections">
    <line x1="100" y1="200" x2="300" y2="150" stroke="#ff9a9e" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="300" y1="150" x2="500" y2="100" stroke="#fad0c4" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="500" y1="100" x2="700" y2="250" stroke="#fbc2eb" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Moving Cloud -->
  <g id="cloud">
    <ellipse cx="150" cy="50" rx="60" ry="30" fill="#ffffff" opacity="0.8">
      <animate attributeName="cx" from="150" to="850" dur="12s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="180" cy="60" rx="40" ry="20" fill="#ffffff" opacity="0.6">
      <animate attributeName="cx" from="180" to="880" dur="12s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Ground -->
  <rect y="370" width="800" height="30" fill="#4e4b72" />
</svg>