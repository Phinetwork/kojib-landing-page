<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="Kojib - The frontier of AI innovation. Explore the boundaries of imagination and intelligence.">
  <title>Kojib - Where Imagination Meets Intelligence</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Intro Section -->
  <div id="intro">
    <!-- Canvas for the Three.js Particle System -->
    <canvas id="particleCanvas"></canvas>
    <!-- Content Overlay -->
    <div class="content">
      <!-- Logo -->
      <img src="image/logo.svg" alt="Kojib Logo" class="kojib-logo">

      <h1 class="headline">
        Where <span class="highlight">Imagination</span> Meets <span class="intelligence">Intelligence</span>
      </h1>
      <p class="subtext">
        At Kojib, we pioneer the boundaries of AI to create intelligent, human-centric solutions.
      </p>
      <div class="scroll-prompt">Scroll to Discover ↓</div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>&copy; 2024 Kojib. All rights reserved.</p>
      <div class="social-links">
        <a href="https://twitter.com/kojib_com" target="_blank">Twitter</a>
        <a href="https://instagram.com/kojib_com" target="_blank">Instagram</a>
        <a href="https://linkedin.com/company/kojib" target="_blank">LinkedIn</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="lib/three.min.js"></script>
  <script src="lib/gsap.min.js"></script>
  <script src="lib/ScrollTrigger.min.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/scroll.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
